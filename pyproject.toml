[project]
name = "credit-agent"
version = "0.1.0"
description = "Conversational AI agent for credit product selection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "langchain-openai",
    "langgraph",
    "pydantic-settings",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
credit-agent = "credit_agent:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

